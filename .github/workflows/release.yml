name: Publish SEP
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['custom_components/smartify_energy/manifest.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sep-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validation.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish manifest version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py
