name: SEP Regression Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  budget-and-ww:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile integration
        run: python -m compileall -q custom_components/smartify_energy tests
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -v
