name: Publish SEP 0.2.30
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-0.2.30.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q custom_components/smartify_energy tests
      - run: python -m unittest discover -s tests -v
      - name: Publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, os
          version = json.loads(pathlib.Path('custom_components/smartify_energy/manifest.json').read_text())['version']
          assert version == '0.2.30'
          body = pathlib.Path('CHANGELOG.md').read_text().split('\n## ', 1)[0]
          pathlib.Path('/tmp/release.md').write_text(body)
          subprocess.run(['gh', 'release', 'create', version, '--target', os.environ['GITHUB_SHA'], '--title', 'Smartify Energy Pro '+version, '--notes-file', '/tmp/release.md', '--latest'], check=True)
          PY
